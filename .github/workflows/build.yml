name: Build Mobile Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'
      - 'v*'

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.workflow }}-${{ github.ref }}

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  UPDATE_SERVER_URL: ${{ vars.UPDATE_SERVER_URL }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - &setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - &setup-flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true
      - run: dart analyze --fatal-infos lib test
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: go vet ./...
        working-directory: native
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          if [ -z "$version" ]; then
            echo "pubspec.yaml 缺少 version。" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="app-v${version//+/-}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - &setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - *setup-go
      - *setup-flutter
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，使用默认签名构建 APK。"
          fi
      - run: python scripts/build_android.py
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - *setup-python
      - *setup-go
      - *setup-flutter
      - name: Check Xcode and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          go version
          flutter --version
          flutter precache --ios
      - name: Build unsigned iOS package
        run: python scripts/build_ios.py
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [checks, prepare, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过重复创建。"
            exit 0
          fi
          cat > notes.md <<EOF
          真果鉴移动端 ${VERSION} 安装包：

          Android（Android 7.0+ 手机 / 平板 / Android TV）：
          - \`zhenguojian-${VERSION}-arm64-v8a.apk\`：主流 64 位安卓手机与平板推荐
          - \`zhenguojian-${VERSION}-armeabi-v7a.apk\`：32 位安卓设备与智能电视/盒子推荐
          - \`zhenguojian-${VERSION}-x86_64.apk\`：x86_64 设备与模拟器

          iOS（iOS 15.1+ iPhone / iPad）：
          - \`zhenguojian-${VERSION}-ios-unsigned.ipa\`：未签名 IPA，可通过自签或侧载工具安装
          EOF
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "真果鉴移动端 ${VERSION}" --notes-file notes.md
